services:
  backend:
    build:
      context: ./backend/
      dockerfile: Dockerfile
    container_name: campus-navigation-backend
    env_file:
      - ./backend/.env.docker
    restart: unless-stopped
    networks:
      - campus-internal
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/docs')"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
  frontend:
    build:
      context: ./frontend/
      dockerfile: Dockerfile
    container_name: campus-navigation-frontend 
    networks:
      - campus-internal
      - reverse-proxy
    env_file:
      - ./frontend/.env.local
    restart: unless-stopped
networks:
  campus-internal:
    name: campus-project_campus-internal
    driver: bridge
  reverse-proxy:
    name: reverse-proxy
    external: true
